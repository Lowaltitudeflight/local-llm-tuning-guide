name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run planner unit tests (includes the offline-HTML check)
        run: python -m unittest discover tests -v
      - name: Repository health checks (links, bilingual parity, benchmark schema)
        run: python tools/check_repo.py
      - name: Lint Python (ruff)
        run: |
          python -m pip install --quiet "ruff>=0.6,<1"
          ruff check tools bench tests
